name: Zizmor

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
    types:
      - checks_requested
  schedule:
    - cron: "43 5 * * 1"
  workflow_dispatch:

permissions: {}

jobs:
  zizmor:
    name: Run zizmor
    permissions:
      actions: read # Inspect workflow metadata during the central audit.
      contents: read
      security-events: write # Upload the Zizmor SARIF analysis.
    uses: LCV-Ideas-Software/.github/.github/workflows/zizmor.yml@f90943a06122468b316c05bb88403d2df451b9f8 # zizmor/v2.3.1
