name: Public Format

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  merge_group:
    types:
      - checks_requested

permissions: {}

concurrency:
  group: public-format-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  prettier-public:
    name: Check index.html formatting
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          check-latest: true
          cache: npm

      - name: Verify npm registry
        shell: bash
        run: test "$(npm config get registry)" = "https://registry.npmjs.org/"

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Validate application
        run: |
          npm run format:public:check
          npm run lint
          npm run biome
          npm test
          npm run build
          # Gate do inventário legal (issue #215) ANTES do merge: cópias
          # idênticas e fiéis ao package.json/lockfile — o mesmo gate roda no
          # deploy, mas aqui ele rejeita o drift em pull_request/merge_group.
          node scripts/verify-thirdparty.mjs
