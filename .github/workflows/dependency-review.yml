name: Dependency Review
on:
  pull_request:
    branches:
      - main
  merge_group:
    types:
      - checks_requested
permissions: {}
concurrency:
  group: dependency-review-${{ github.ref }}
  cancel-in-progress: true
jobs:
  candidate_review:
    permissions:
      contents: read
    name: Dependency Review candidate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: ${{ github.event_name == 'merge_group' || github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test native auto-merge workflow boundaries
        run: node --test .github/scripts/native-auto-merge-workflows.regression.mjs
      - name: Review pull request dependencies
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: low
          fail-on-scopes: runtime, development, unknown

      - name: Review merge-group dependencies
        if: ${{ github.event_name == 'merge_group' }}
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          base-ref: ${{ github.event.merge_group.base_sha }}
          head-ref: ${{ github.event.merge_group.head_sha }}
          fail-on-severity: low
          fail-on-scopes: runtime, development, unknown

  dependency_review:
    permissions: {}
    name: Dependency Review
    if: >-
      ${{
        always() &&
        (
          github.event_name == 'merge_group' ||
          github.event.pull_request.head.repo.full_name == github.repository
        )
      }}
    needs:
      - candidate_review
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Reject unsuccessful dependency review candidate
        if: ${{ needs.candidate_review.result != 'success' }}
        run: exit 1

      - name: Preserve the required dependency review context
        # Bot feedback remains an exact-head admission check. The former inline
        # gate depended on Repository.mergeQueue, which has no documented
        # granular GITHUB_TOKEN permission and failed under least privilege.
        if: ${{ needs.candidate_review.result == 'success' }}
        run: echo "Dependency review candidate passed."
