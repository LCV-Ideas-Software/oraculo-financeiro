# This workflow is managed by gh actions-lock.

name: Deploy

on:
  push:
    branches:
      - main

permissions: {}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  NODE_OPTIONS: "--no-deprecation"

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  deploy:
    name: Validate and deploy applications
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: cloudflare-production
    permissions:
      contents: read # Read the exact source revision being deployed.
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          check-latest: true
          package-manager-cache: false

      - name: Set up Ruby 3.4 for GitHub Licensee
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: "3.4.10"
          bundler-cache: true

      - name: Verify npm registry
        shell: bash
        run: test "$(npm config get registry)" = "https://registry.npmjs.org/"

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Validate applications
        run: |
          npm audit --audit-level=high
          npm run lint
          npm run biome
          npm test
          npm run build
          npm run format:public:check
          # Gate do inventário legal (issue #215): cópias idênticas E fiéis ao
          # package.json/lockfile (nomes, versões e licenças) — igualdade mútua
          # sozinha deixaria as duas envelhecerem juntas.
          node scripts/verify-thirdparty.mjs
          # Gate dos avisos (ORAFINC-15): o Licensee oficial do GitHub comprova
          # o texto integral; variantes revisadas ficam presas ao sha256.
          node scripts/generate-notices.mjs --check

      - name: Deploy Pages application with Wrangler
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          packageManager: npm
          workingDirectory: .
          command: pages deploy dist --project-name=oraculo-financeiro --branch=main --commit-dirty=true

      - name: Deploy Cron Worker with Wrangler
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          packageManager: npm
          workingDirectory: .
          command: deploy --strict --config workers/taxaipca-motor/wrangler.json
